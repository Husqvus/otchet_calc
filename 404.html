<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Страница не найдена</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="error-page">
    <header class="site-header">
        <div class="container header-inner">
            <div class="logo">
                <span class="logo-icon">📊</span>
                <span class="logo-text">АктКалькулятор</span>
            </div>
            <nav class="nav">
                <a href="index.html" class="nav-link">Калькулятор</a>
            </nav>
        </div>
    </header>

    <main class="container error-container">
        <div class="error-card">
            <div class="error-code">404</div>
            <h1 class="error-title">Страница не найдена</h1>
            <p class="error-subtitle">
                Кажется, вы забрели в несуществующий акт выполненных работ.
                Такой страницы у нас нет — возможно, она была удалена или вы ошиблись в адресе.
            </p>
            <div class="error-actions">
                <a href="index.html" class="btn btn-primary">
                    <span>←</span>
                    <span>Вернуться на главную</span>
                </a>
            </div>
            <div class="error-illustration">
                <svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <rect x="30" y="40" width="140" height="100" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
                    <rect x="45" y="55" width="80" height="8" rx="4" fill="#c7d2fe"/>
                    <rect x="45" y="70" width="110" height="8" rx="4" fill="#c7d2fe"/>
                    <rect x="45" y="85" width="60" height="8" rx="4" fill="#c7d2fe"/>
                    <circle cx="150" cy="115" r="18" fill="#f97316" opacity="0.9"/>
                    <text x="150" y="121" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">?</text>
                    <path d="M 20 140 L 180 140" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 4"/>
                </svg>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>© 2026 АктКалькулятор · Расчёт % выполнения по актам</p>
        </div>
    </footer>
</body>
</html>
